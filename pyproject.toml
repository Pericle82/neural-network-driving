[project]
name = "neural-network-driving"
version = "0.1.0"
description = "Impara le reti neurali costruendone una che guida: rete minima 8→6→4 addestrata per neuroevoluzione."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "jupyterlab>=4.2",
    "jupytext>=1.16",
    "matplotlib>=3.9",
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sim", "server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:Using `httpx`"]
